<!doctype html>
<html><head><meta charset="utf-8"><title>dev — phone × 3</title>
<style>
  body{margin:0;background:#161210;display:flex;gap:18px;justify-content:center;align-items:flex-start;padding:18px}
  figure{margin:0}
  figcaption{font:500 11px/1 'Azeret Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#8E8073;margin:0 0 8px 2px}
  iframe{width:390px;height:844px;border:0;box-shadow:0 0 0 1px #3A2E24;background:#100B08;display:block}
</style></head>
<body>
<figure><figcaption>A — the name (after preloader)</figcaption><iframe data-y="0" src="../index.html?lang=en&nowidget=1"></iframe></figure>
<figure><figcaption>B — the darkroom, developing</figcaption><iframe data-y="1500" src="../index.html?lang=en&nowidget=1"></iframe></figure>
<figure><figcaption>C — the ladder, Spanish</figcaption><iframe data-y="6200" src="../index.html?lang=es"></iframe></figure>
<script>
  // the site scrolls INSIDE #scroll (artifact-host harness), so drive that element, not the window
  document.querySelectorAll('iframe').forEach(f => f.addEventListener('load', () => {
    const y = +f.dataset.y; if (!y) return
    setTimeout(() => { const s = f.contentDocument && f.contentDocument.getElementById('scroll'); if (s) s.scrollTo({ top: y, behavior: 'instant' })
      // a programmatic jump bypasses Lenis' virtual scroll — tell ScrollTrigger to re-read the scroller so scrubs land where a real scroll would put them
      setTimeout(() => { const ST = f.contentWindow && f.contentWindow.ScrollTrigger; if (ST) { ST.refresh(); ST.update() } }, 300) }, 2600)
  }))
</script>
</body></html>
